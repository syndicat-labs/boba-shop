events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  server_tokens off;

  upstream web { server web:8000; }

  server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Forward the edge's proto (cloudflared sets X-Forwarded-Proto: https);
      # Django trusts it only when TRUST_PROXY=1.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /ws/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
    location /assets/ { root /srv; }
    location /media/ { root /srv; }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
  }
}
