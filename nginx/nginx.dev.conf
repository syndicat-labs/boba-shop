events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  upstream web { server web:8000; }
  server {
    listen 80;
    location /api/ {
      proxy_pass http://web;
      # App enforces a 10 MB image cap (UPLOAD_TOO_LARGE); default nginx limit is 1 MB.
      # 12 MB leaves room for the multipart/form-data boundary and part headers.
      client_max_body_size 12m;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # cloudflared (dev tunnel) sets X-Forwarded-Proto: https; dev settings
      # trust it via SECURE_PROXY_SSL_HEADER so DRF's CSRF origin check sees
      # the https scheme the browser sees.
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /ws/ {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location /assets/ { root /srv; }
    location /media/ { root /srv; }
    location / { root /usr/share/nginx/html; try_files $uri $uri/ /index.html; }
  }
}
