# Production compose — daphne (ASGI: HTTP + WebSocket), prod settings, secrets via backend/.env.prod.
# TLS is NOT terminated here. Use deploy/prod.sh with a cloudflared tunnel (recommended)
# or put a TLS-terminating proxy (nginx+certbot, LB) in front of the nginx service.
services:
  postgres:
    image: postgres:16-alpine
    env_file: ./backend/.env.prod
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: ./backend
    command: sh -c "python manage.py migrate --noinput && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    env_file: ./backend/.env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      MEDIA_ROOT: /media
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8000),2)"]
      interval: 5s
      retries: 20
      start_period: 15s
    volumes:
      - "media_data:/media"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - "./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro"
      - "./frontend/dist/boba-shop/browser:/usr/share/nginx/html:ro"
      - "./assets:/srv/assets:ro"
      - "media_data:/srv/media:ro"
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped

  # Optional Cloudflare named tunnel (TLS at the edge). Started only via:
  #   CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d cloudflared
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    profiles: ["tunnel"]
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
