[project]
name = "boba-shop-backend"
version = "0.1.0"
description = "Boba Shop — multi-tenant production backend (obsidian)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.1,<6",
    "djangorestframework>=3.15",
    "channels>=4.1",
    "daphne>=4.1",
    "channels-redis>=4.2",
    "psycopg[binary]>=3.1",
    "redis>=5",
    "celery>=5.4",
    "Pillow>=11",
    "qrcode[pil]>=8",
    "django-cors-headers>=4.4",
    "django-filter>=24",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-redis",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["tests"]
