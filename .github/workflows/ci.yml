name: ci
on: [push, pull_request]
jobs:
  lint-type-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e backend[dev]
      - run: ruff check backend
      - run: cd backend && mypy . --ignore-missing-imports
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    services:
      postgres: {image: postgres:16-alpine, env: {POSTGRES_DB: boba, POSTGRES_USER: boba, POSTGRES_PASSWORD: boba}, ports: ["5432:5432"], options: --health-cmd="pg_isready -U boba" --health-interval=5s}
      redis: {image: redis:7-alpine, ports: ["6379:6379"]}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e backend[dev]
      - run: cd backend && pytest --cov=core --cov-fail-under=80
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  prod-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -qE 'DEV_MOCK_PSP\s*=\s*"1"' backend/config/settings/prod.py; then
            echo "mock psp enabled in prod — forbidden"; exit 1
          fi
          if grep -qE 'PSP_ACTIVE\s*=\s*"mock"' backend/config/settings/prod.py; then
            echo "mock psp active in prod — forbidden"; exit 1
          fi
          echo "prod mock guard ok"
